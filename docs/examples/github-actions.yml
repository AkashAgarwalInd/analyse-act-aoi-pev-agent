# Example: run Analyse-Act headlessly from GitHub Actions. Copy to .github/workflows/ in YOUR repo.
#
#   1. Run the workflow with a task. It stops at the [P] gate (or at a budget pause) and the job summary
#      says what it's waiting for and which inputs to give next. Tick "guided" to also stop after [A], [O]
#      and [I], so you can read each stage in the summary before going on.
#   2. Run it again with the thread id plus either a choice (A, B, …, optionally with an edit), a
#      decision (continue / stop), or at a guided stop a note (continue with that context) — repeat
#      until it finishes. Always run it on the SAME commit.
#   3. If a run crashed (API error, timeout), run it again with only the thread id: it retries that stage.
#      A crash during [E] or its fix retry can't be retried (its half-made edits would hide from the drift
#      check): apply the aa-<thread>-patch locally, then finish with /analyse-act --from E or start a new run.
#
# Every run saves the checkpoint and the uncommitted edits (.aa/worktree.patch) as artifact aa-<thread>,
# and the next run restores both, so a run can pause any number of times. The final diff is in the job
# summary and in artifact aa-<thread>-patch. Nothing is committed or pushed; apply it with `git apply`.
# A --branch created in one job does not survive into the next; the patch does.
#
# Needs an ANTHROPIC_API_KEY repository secret. Set CHECKS to your own test command: it is the only
# command the agent may run. Inputs reach the shell only through env vars, never ${{ }} inside run:.
name: analyse-act

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task (start a new run)"
        required: false
      thread:
        description: "Thread id to continue (from the previous run's summary)"
        required: false
      choice:
        description: "At the plan gate: approach to execute (A, B, …)"
        required: false
      edit:
        description: "At the plan gate, optional: your changes to that approach"
        required: false
      decision:
        description: "At a budget, drift or guided stop: continue or stop"
        required: false
      note:
        description: "At a guided stop, optional: context for the next stages (continues the run)"
        required: false
      guided:
        description: "When starting: also stop after [A], [O] and [I]"
        type: boolean
        default: false

jobs:
  analyse-act:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # -eo pipefail
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TASK: ${{ inputs.task }}
      THREAD: ${{ inputs.thread }}
      CHOICE: ${{ inputs.choice }}
      EDIT: ${{ inputs.edit }}
      DECISION: ${{ inputs.decision }}
      NOTE: ${{ inputs.note }}
      GUIDED: ${{ inputs.guided && '--guided' || '' }}
      CHECKS: "npm test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "analyse-act-agent @ git+https://github.com/AkashAgarwalInd/analyse-act-aoi-pev-agent#subdirectory=langgraph_agent"

      # continuing: restore the checkpoint and the edits saved by the previous run of this thread
      - if: inputs.thread != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          name: aa-${{ inputs.thread }}
          path: .aa
          search_artifacts: true
          workflow_conclusion: completed  # also a failed run, so a crashed stage can be retried
      - if: inputs.thread != ''
        run: if [ -s .aa/worktree.patch ]; then git apply .aa/worktree.patch; fi

      - name: run or resume
        id: agent
        run: |
          set +e
          if [ -n "$TASK" ]; then
            aa-agent run "$TASK" --check "$CHECKS" $GUIDED --plan-out plan.md | tee out.txt
          elif [ -n "$NOTE" ]; then
            # keep a decision too, so note + stop is refused instead of silently continuing
            aa-agent resume --thread "$THREAD" --note "$NOTE" ${DECISION:+--decision "$DECISION"} --plan-out plan.md | tee out.txt
          elif [ -n "$DECISION" ]; then
            aa-agent resume --thread "$THREAD" --decision "$DECISION" --plan-out plan.md | tee out.txt
          else
            aa-agent resume --thread "$THREAD" --choice "$CHOICE" --edit "$EDIT" --plan-out plan.md | tee out.txt
          fi
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          thread=$(sed -n 's/^status=.* thread=//p' out.txt | tail -n 1)
          echo "THREAD=${thread:-$THREAD}" >> "$GITHUB_ENV"

      - name: save state and publish
        if: always() && env.THREAD != ''
        run: |
          git add --intent-to-add -A -- . ':!.aa'
          git diff --binary -- . ':!.aa' > .aa/worktree.patch  # --binary: git apply can't restore binary files otherwise
          cp .aa/worktree.patch "aa-$THREAD.patch"
          {
            [ -f plan.md ] && cat plan.md
            if grep -q '^status=awaiting_stage_decision' out.txt; then
              # guided stop: show what this run printed (the stage(s) it ran, up to the stop). The reports
              # contain ``` blocks (Mermaid, JSON), so the outer fence must be longer or they would close it
              echo '`````'; sed '/^status=/,$d' out.txt; echo '`````'
            fi
            echo '```'; tail -n 4 out.txt; echo '```'
            if [ -s "aa-$THREAD.patch" ]; then echo '```diff'; cat "aa-$THREAD.patch"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always() && env.THREAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: aa-${{ env.THREAD }}
          path: .aa/
          include-hidden-files: true

      - if: always() && env.THREAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: aa-${{ env.THREAD }}-patch
          path: aa-${{ env.THREAD }}.patch

      # paused runs exit 0; a handoff, a refused resume (HEAD moved, bad input) or a crash fails the job
      - if: steps.agent.outputs.rc != '0'
        run: exit 1
