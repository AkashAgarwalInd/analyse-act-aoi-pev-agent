name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        # "shell: bash" means bash -eo pipefail; the default (bash -e) lets `cmd | tee` hide cmd's failure
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck skills/analyse-act/scripts/*.sh scripts/*.sh tests/*.sh tests/fixtures/*.sh

      - name: cache script tests
        run: |
          pipx install check-jsonschema
          sh tests/aa-cache.test.sh | tee out.txt
          if grep -q '^skip' out.txt; then echo "a check was skipped"; exit 1; fi

      - name: validate sample .aa files against schemas
        run: |
          pipx run check-jsonschema --schemafile skills/analyse-act/schemas/cache_meta.schema.json docs/examples/sample-aa/cache_meta.json
          pipx run check-jsonschema --schemafile skills/analyse-act/schemas/schema_cache.schema.json docs/examples/sample-aa/schema_cache.json
          pipx run check-jsonschema --schemafile skills/analyse-act/schemas/session.schema.json docs/examples/sample-aa/current_session.json

      - name: adapters in sync with adapters/src/workflow.md
        run: |
          sh scripts/build-adapters.sh
          changes=$(git status --porcelain adapters/)
          if [ -n "$changes" ]; then echo "$changes"; echo "adapters/ is stale: run sh scripts/build-adapters.sh"; exit 1; fi

      - name: plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

  langgraph-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: langgraph_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
